;=====================================================
;     THE ULTIMATE POLYBAR CONFIG
;     Modern • Beautiful • Functional
;=====================================================

[colors]
; Tokyo Night inspired color scheme
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
tertiary = #7dcfff
alert = #f7768e
warning = #e0af68
success = #9ece6a
disabled = #565f89

; Transparency variations
bg-transparent = #aa1a1b26
bg-solid = #ff1a1b26

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
radius = 12
fixed-center = true

background = ${colors.bg-transparent}
foreground = ${colors.foreground}

line-size = 3
line-color = ${colors.primary}

border-size = 2
border-color = ${colors.background-alt}

padding-left = 2
padding-right = 2

module-margin-left = 1
module-margin-right = 1

; Font configuration
font-0 = "JetBrainsMono Nerd Font:size=10:weight=medium;2"
font-1 = "JetBrainsMono Nerd Font:size=12:weight=bold;3"
font-2 = "JetBrainsMono Nerd Font:size=14:weight=bold;3"
font-3 = "JetBrainsMono Nerd Font:size=16:weight=bold;4"

modules-left = workspaces separator filesystem
modules-center = date
modules-right = memory cpu temperature network pulseaudio battery powermenu

tray-position = right
tray-padding = 2
tray-background = ${colors.background-alt}

wm-restack = bspwm
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/secondary]
inherit = bar/main
monitor = ${env:MONITOR2:}
modules-center = spotify
modules-right = date

;=====================================================
;                   MODULES
;=====================================================

[module/workspaces]
type = internal/xworkspaces

pin-workspaces = false
enable-click = true
enable-scroll = true
reverse-scroll = false

icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;
icon-6 = 7;
icon-7 = 8;
icon-8 = 9;
icon-9 = 10;

format = <label-state>
format-padding = 1

label-active = %icon% %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 2

label-occupied = %icon% %name%
label-occupied-foreground = ${colors.secondary}
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 2

label-urgent = %icon% %name%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background-alt}
label-urgent-padding = 2

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/separator]
type = custom/text
content = "|"
content-foreground = ${colors.disabled}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
mount-1 = /home

format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.tertiary}
label-mounted = %free%

format-unmounted = <label-unmounted>
format-unmounted-prefix = " "
format-unmounted-prefix-foreground = ${colors.alert}
label-unmounted = %mountpoint%: not mounted
label-unmounted-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.warning}
label = %percentage:2%%
format = <format-prefix><label>
format-background = ${colors.background-alt}
format-padding = 2

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%
format = <format-prefix><label>
format-background = ${colors.background-alt}
format-padding = 2

[module/network]
type = internal/network
interface = wlan0
interval = 3.0

format-connected = <ramp-signal> <label-connected>
format-connected-background = ${colors.background-alt}
format-connected-padding = 2
label-connected = %essid% %downspeed:9%

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.background-alt}
format-disconnected-padding = 2
label-disconnected = 睊 disconnected
label-disconnected-foreground = ${colors.alert}

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-foreground = ${colors.success}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80

format = <ramp> <label>
format-background = ${colors.background-alt}
format-padding = 2
format-warn = <ramp> <label-warn>
format-warn-background = ${colors.background-alt}
format-warn-padding = 2

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.tertiary}

[module/date]
type = internal/date
interval = 1

date = %A, %B %d
time = %I:%M %p

format-prefix = " "
format-prefix-foreground = ${colors.primary}

label = %date% | %time%
format = <format-prefix><label>
format-background = ${colors.background-alt}
format-padding = 3

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.background-alt}
format-volume-padding = 2
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.background-alt}
format-muted-padding = 2
label-muted = " muted"
label-muted-foreground = ${colors.alert}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.success}

click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.background-alt}
format-charging-padding = 2
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.background-alt}
format-discharging-padding = 2
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
format-full-background = ${colors.background-alt}
format-full-padding = 2
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.success}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.warning}
animation-charging-framerate = 750

[module/spotify]
type = custom/script
tail = true
format-prefix = " "
format-prefix-foreground = ${colors.success}
format = <label>
exec = ~/.config/polybar/scripts/spotify.sh

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1
format-background = ${colors.background-alt}
format-padding = 2

label-open = 
label-open-foreground = ${colors.alert}
label-close = 
label-close-foreground = ${colors.alert}
label-separator = |
label-separator-foreground = ${colors.disabled}

menu-0-0 = reboot
menu-0-0-exec = systemctl reboot
menu-0-1 = power off
menu-0-1-exec = systemctl poweroff

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 600
format-prefix = " "
format-prefix-foreground = ${colors.tertiary}
format-background = ${colors.background-alt}
format-padding = 2

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 600
format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-background = ${colors.background-alt}
format-padding = 2

;=====================================================
;                   SETTINGS
;=====================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

[global/wm]
margin-top = 5
margin-bottom = 5