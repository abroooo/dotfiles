[bar/main]
width = 100%
height = 30
radius = 10     ; Rounded corners
fixed-center = true
background = #2e3440
foreground = #d8dee9
border-size = 2
border-color = #4c566a
padding-left = 10
padding-right = 10

modules-left = workspaces
modules-center = clock
modules-right = tray

; Workspace Module
[module/workspaces]
type = internal/xworkspaces
icon-spacing = 2
label-active = %name%
label-active-foreground = #88c0d0
label-occupied = %name%
label-occupied-foreground = #a3be8c
label-urgent = %name%
label-urgent-foreground = #bf616a
label-empty = %name%
label-empty-foreground = #4c566a

; Clock Module
[module/clock]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
label-font = 2
label-padding = 2

; System Tray Module
[module/tray]
type = internal/tray
tray-padding = 5
background = #3b4252
tray-position = right

; Fonts
font-0 = "Noto Sans:size=10;antialias=true;autohint=true"
font-1 = "Iosevka Nerd Font:size=12;antialias=true;autohint=true"

[settings]
screenchange-reload = true
round-borders = true

