#################################
#       EPIC PICOM CONFIG      #
#  Hyprland-Style Animations   #
#################################

#################################
#          Shadows              #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@",
  "QTILE_INTERNAL = 1"
];

#################################
#           Fading              #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;
no-fading-openclose = false;

fade-exclude = [
  "class_g = 'slop'"
];

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'org.wezfurlong.wezterm'",
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'",
  "90:class_g = 'Rofi'",
  "85:class_g = 'code-oss'",
  "85:class_g = 'Code'",
  "100:QTILE_INTERNAL = 1"
];

#################################
#       Rounded Corners         #
#################################
corner-radius = 12;

corner-radius-rules = [
  "15:class_g = 'Alacritty'",
  "15:class_g = 'kitty'",
  "10:class_g = 'Rofi'",
  "0:QTILE_INTERNAL = 1",
  "0:fullscreen"
];

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'slop'"
];

#################################
#     Background Blurring       #
#################################
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@",
  "QTILE_INTERNAL = 1"
];

#################################
#       General Settings        #
#################################
backend = "glx";
vsync = true;
dbus = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-ewmh-active-win = true;
unredir-if-possible = false;
use-damage = true;


log-level = "warn";

#################################
#         Animations            #
#################################
animations = true;

animations = (
  # Window opening animation - Hyprland style slide + fade
  {
    triggers = ["open"];
    opacity = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
      duration = 0.4;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
      duration = 0.4;
      start = 0.95;
      end = 1;
    };
    scale-y = "scale-x";
    offset-x = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
      duration = 0.4;
      start = "window-width * 0.1";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.05, 0.9, 0.1, 1)";
      duration = 0.4;
      start = "window-height * 0.1";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  
  # Window closing animation - Hyprland style shrink + fade
  {
    triggers = ["close"];
    opacity = {
      curve = "cubic-bezier(0.9, 0.1, 0.9, 0.05)";
      duration = 0.3;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.9, 0.1, 0.9, 0.05)";
      duration = 0.3;
      start = 1;
      end = 0.9;
    };
    scale-y = "scale-x";
    offset-x = {
      curve = "cubic-bezier(0.9, 0.1, 0.9, 0.05)";
      duration = 0.3;
      start = 0;
      end = "window-width * -0.05";
    };
    offset-y = {
      curve = "cubic-bezier(0.9, 0.1, 0.9, 0.05)";
      duration = 0.3;
      start = 0;
      end = "window-height * -0.05";
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Window geometry changes (resize/move) - Smooth transitions
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Show/Hide animations for window mapping/unmapping
  {
    triggers = ["show"];
    opacity = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.25, 0.46, 0.45, 0.94)";
      duration = 0.25;
      start = 0.95;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
  },

  {
    triggers = ["hide"];
    opacity = {
      curve = "cubic-bezier(0.55, 0.085, 0.68, 0.53)";
      duration = 0.25;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = {
      curve = "cubic-bezier(0.55, 0.085, 0.68, 0.53)";
      duration = 0.25;
      start = 1;
      end = 0.95;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
  }
);

#################################
#      Window Type Settings     #
#################################
wintypes: {
  tooltip = { 
    fade = true; 
    shadow = false; 
    opacity = 0.95; 
    focus = true; 
    full-shadow = false; 
  };
  dock = { 
    shadow = false; 
    clip-shadow-above = true; 
  };
  dnd = { 
    shadow = false; 
  };
  popup_menu = { 
    opacity = 0.95; 
    shadow = true; 
  };
  dropdown_menu = { 
    opacity = 0.95; 
    shadow = true; 
  };
  menu = { 
    opacity = 0.95; 
    shadow = true; 
  };
  utility = {
    shadow = false;
  };
  splash = {
    shadow = false;
  };
  dialog = {
    shadow = true;
    opacity = 0.95;
  };
  normal = {
    shadow = true;
  };
  notification = {
    shadow = false;
    opacity = 0.95;
  };
};